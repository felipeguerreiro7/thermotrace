# Testes automáticos a cada push na main e em cada pull request (TT-062).
#
# Repete o que backend/scripts/testar.ps1 e o Gradle fazem neste computador, num ambiente
# limpo: se passar aqui, o "clone limpo compila" do TT-010 está comprovado a cada commit.
#
# Nenhum segredo é usado. O banco é descartável e só existe durante o job; a senha abaixo
# vale apenas para esse contêiner. O APK de piloto (assinado) continua sendo gerado só no
# computador do projeto, porque a chave de assinatura nunca vem para o GitHub.

name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor:
    name: API e portal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Mesma versão do banco de homologação no Render.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thermotrace
          POSTGRES_PASSWORD: somente_ci
          POSTGRES_DB: thermotrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thermotrace -d thermotrace_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # O conftest recusa qualquer banco cujo nome não termine em _test.
      THERMOTRACE_TEST_DATABASE_URL: postgresql+psycopg://thermotrace:somente_ci@127.0.0.1:5432/thermotrace_test
      DATABASE_URL: postgresql+psycopg://thermotrace:somente_ci@127.0.0.1:5432/thermotrace_test
      SECRET_KEY: synthetic-only-test-key-0a1b2c3d4e5f6g7h8i9j
      AMBIENTE: local
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Mesma versão da imagem do Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Aplicar migrações
        run: python -m alembic upgrade head

      - name: Conferir modelos contra migrações
        run: python -m alembic check

      - name: Testes da API
        run: python -m pytest -q --junitxml=resultado-api.xml

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Testes do portal
        run: node --test tests_web/

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-api
          path: backend/resultado-api.xml
          retention-days: 14

  android:
    name: Android (testes JVM e APK debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # O daemon do Gradle 9.7.1 exige JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Instalar plataforma Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null

      # O gradlew fica sem bit de execução no repositório (projeto escrito em Windows).
      - name: Testes JVM
        run: bash ./gradlew --no-configuration-cache testDebugUnitTest

      - name: APK debug e lint
        run: bash ./gradlew --no-configuration-cache assembleDebug lintDebug

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-android
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
